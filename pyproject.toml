[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "insar-studio"
version = "1.2.0"
description = "Local guided InSAR time-series deformation workstation (SBAS / PS / DS / D-InSAR)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "InSAR Studio" }]
dependencies = [
  "numpy>=1.24,<3.0",
  "scipy>=1.10",
  "scikit-image>=0.20",
  "matplotlib>=3.7",
  "tifffile>=2021.7.2",
  "Flask>=2.2,<4.0",
  "requests>=2.28",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
insar-studio = "insar_studio.cli:main"

[tool.setuptools]
packages = ["insar_studio", "insar_studio.core"]
include-package-data = true

[tool.setuptools.package-data]
insar_studio = [
  "templates/*.html",
  "static/css/*.css",
  "static/js/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
