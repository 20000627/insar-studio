<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#213f37">
  <title>InSAR Studio · 时序干涉形变处理平台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23213f37'/%3E%3Ccircle cx='24' cy='24' r='15' fill='none' stroke='%23f4efe2' stroke-width='1.5' opacity='.7'/%3E%3Cpath d='M20 24l4-7 4 7-4 7z' fill='%23d9a441'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="1.2" opacity=".55"/>
          <circle cx="24" cy="24" r="14" stroke="currentColor" stroke-width="1.2" opacity=".8"/>
          <circle cx="24" cy="24" r="8" stroke="currentColor" stroke-width="1.4"/>
          <path d="M4 30c8-5 13-12 20-12s13 7 20 12" stroke="currentColor" stroke-width="1.1" opacity=".65"/>
          <path d="M7 36c6-4 11-8 17-8s11 4 17 8" stroke="currentColor" stroke-width="1.1" opacity=".4"/>
          <path d="M20 24l4-7 4 7-4 7-4-7z" fill="currentColor" opacity=".9"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>InSAR Studio</h1>
        <p>时序干涉形变处理平台</p>
      </div>
    </div>
    <div class="topbar-mid">
      <span class="local-chip"><i class="pulse"></i> 本地工作区 · 数据不出机</span>
      <span class="version-chip" id="version-chip">v{{ version }}</span>
    </div>
    <div class="topbar-actions">
      <div class="mode-switch" role="group" aria-label="参数模式">
        <button type="button" data-mode="guided" class="active">引导</button>
        <button type="button" data-mode="expert">专家</button>
      </div>
      <button class="icon-btn" id="btn-help" title="使用说明">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M9.7 9.2a2.4 2.4 0 1 1 3.6 2.1c-.8.5-1.3 1-1.3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1" fill="currentColor"/></svg>
        <span>说明</span>
      </button>
      <button class="icon-btn" id="btn-doctor" title="检查运行环境">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.2-2.8 7.7-7 9-4.2-1.3-7-4.8-7-9V6l7-3z" stroke="currentColor" stroke-width="1.5"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>环境</span>
      </button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="project-rail" id="project-rail">
      <div class="rail-head">
        <div>
          <span class="eyebrow">PROJECTS</span>
          <h2>项目库</h2>
        </div>
        <button class="btn btn-primary btn-small" id="btn-new">＋ 新建</button>
      </div>
      <div class="rail-search">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="project-search" type="search" placeholder="搜索项目名称或编号">
      </div>
      <div class="project-list" id="project-list">
        <div class="rail-empty">正在读取工作区…</div>
      </div>
      <div class="rail-foot">
        <div class="workspace-path" id="workspace-path">workspace/</div>
        <div class="rail-legal">全部中间产品与报告仅写入本地工作区。</div>
      </div>
    </aside>

    <main class="stage">
      <div class="stage-head" id="stage-head"></div>
      <nav class="stepper" id="stepper" aria-label="处理流程"></nav>
      <section class="step-content" id="step-content" tabindex="-1"></section>
    </main>

    <aside class="console" id="console">
      <div class="console-head">
        <div>
          <span class="eyebrow">JOB CONSOLE</span>
          <h2>任务控制台</h2>
        </div>
        <span class="console-state idle" id="console-state"><i></i><span>空闲</span></span>
      </div>
      <div class="console-progress">
        <div class="progress-track"><div class="progress-fill" id="job-progress"></div></div>
        <div class="progress-meta">
          <span id="job-stage">等待任务</span>
          <span id="job-percent">0%</span>
        </div>
      </div>
      <div class="job-actions" id="job-actions">
        <button class="btn btn-small btn-ghost" id="btn-cancel-job" disabled>取消任务</button>
        <button class="btn btn-small btn-ghost" id="btn-clear-log" disabled>清空日志</button>
      </div>
      <div class="console-log" id="console-log">
        <div class="console-empty">
          <span class="console-glyph">⌁</span>
          <p>运行处理后，这里会显示每一步的进度与日志。</p>
        </div>
      </div>
      <div class="console-foot">
        <div class="tip-line"><span>提示</span> 长任务在后台线程执行，刷新页面不会中断。</div>
      </div>
    </aside>
  </div>

  <div class="toast-host" id="toast-host"></div>
  <div id="modal-root"></div>

  <script src="/static/js/app.js?v={{ version }}"></script>
</body>
</html>
